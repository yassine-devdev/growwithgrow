groups:
  - name: application_alerts
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status_code=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
          component: backend
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second for {{ $labels.instance }}"

      # High response time
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          component: backend
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }}s for {{ $labels.instance }}"

      # Database connection issues
      - alert: DatabaseConnectionHigh
        expr: database_connections_active / (database_connections_active + database_connections_idle) > 0.8
        for: 3m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Database connection pool usage high"
          description: "Database connection pool is {{ $value | humanizePercentage }} full"

      # AI service errors
      - alert: AIServiceErrors
        expr: rate(ai_requests_total{status="error"}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
          component: ai
        annotations:
          summary: "AI service error rate high"
          description: "AI service error rate is {{ $value }} errors per second"

      # High AI costs
      - alert: HighAICosts
        expr: increase(ai_cost_estimate_total[1h]) > 100
        for: 0m
        labels:
          severity: warning
          component: ai
        annotations:
          summary: "High AI service costs detected"
          description: "AI costs have increased by ${{ $value }} in the last hour"

  - name: infrastructure_alerts
    rules:
      # High memory usage
      - alert: HighMemoryUsage
        expr: (memory_usage_bytes{type="rss"} / (1024*1024*1024)) > 1
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}GB on {{ $labels.instance }}"

      # High CPU usage
      - alert: HighCPUUsage
        expr: cpu_usage_percent > 80
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}"

      # Service down
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Service is down"
          description: "{{ $labels.job }} service is down on {{ $labels.instance }}"

      # Disk space low
      - alert: DiskSpaceLow
        expr: (disk_usage_bytes{type="available"} / disk_usage_bytes{type="total"}) < 0.1
        for: 5m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Disk space low"
          description: "Disk space is {{ $value | humanizePercentage }} full on {{ $labels.instance }}"

  - name: business_alerts
    rules:
      # Low user registrations
      - alert: LowUserRegistrations
        expr: rate(user_registrations_total[1h]) < 0.01
        for: 30m
        labels:
          severity: warning
          component: business
        annotations:
          summary: "Low user registration rate"
          description: "User registration rate is {{ $value }} per second (very low)"

      # High user churn (no logins)
      - alert: NoUserLogins
        expr: rate(user_logins_total[1h]) == 0
        for: 15m
        labels:
          severity: critical
          component: business
        annotations:
          summary: "No user logins detected"
          description: "No user logins in the last hour - possible system issue"

      # WebSocket connection issues
      - alert: WebSocketConnectionDrop
        expr: websocket_connections_active < 1 and rate(websocket_connections_active[5m]) < 0
        for: 5m
        labels:
          severity: warning
          component: websocket
        annotations:
          summary: "WebSocket connections dropping"
          description: "WebSocket connections are dropping: {{ $value }} active connections"

  - name: cache_alerts
    rules:
      # Low cache hit rate
      - alert: LowCacheHitRate
        expr: rate(cache_hits_total[5m]) / (rate(cache_hits_total[5m]) + rate(cache_misses_total[5m])) < 0.7
        for: 10m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is {{ $value | humanizePercentage }} (below 70%)"

      # Cache operation slow
      - alert: SlowCacheOperations
        expr: histogram_quantile(0.95, rate(cache_operation_duration_seconds_bucket[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Slow cache operations"
          description: "95th percentile cache operation time is {{ $value }}s"

  - name: external_service_alerts
    rules:
      # External API failures
      - alert: ExternalAPIFailures
        expr: rate(http_requests_total{status_code=~"5..", route=~"/api/external/.*"}[5m]) > 0.01
        for: 3m
        labels:
          severity: warning
          component: external_api
        annotations:
          summary: "External API failures detected"
          description: "External API failure rate is {{ $value }} per second"