[Definition]
# Fail2ban filter for API abuse
failregex = ^<HOST> -.*"(GET|POST|PUT|DELETE) /api/.*" (4\d\d|5\d\d) .*$
            ^<HOST> -.*"(GET|POST|PUT|DELETE) /trpc/.*" (4\d\d|5\d\d) .*$

ignoreregex = ^<HOST> -.*"(GET|POST|PUT|DELETE) /api/health.*" 200 .*$
              ^<HOST> -.*"(GET|POST|PUT|DELETE) /health.*" 200 .*$