# Fail2ban filter for login abuse
failregex = ^<HOST> -.*"POST /api/auth/login.*" (4\d\d|5\d\d) .*$
            ^<HOST> -.*"POST /api/auth/register.*" (4\d\d|5\d\d) .*$
            ^<HOST> -.*"POST /trpc/auth\.login.*" (4\d\d|5\d\d) .*$
            ^<HOST> -.*"POST /trpc/auth\.register.*" (4\d\d|5\d\d) .*$

