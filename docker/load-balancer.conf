# Load Balancer Configuration for High Availability
# This configuration supports multiple backend instances with health checks and failover

# Define upstream backend servers with load balancing
upstream backend_cluster {
    # Load balancing method: least_conn for better distribution
    least_conn;
    
    # Primary backend instances
    server backend-1:4000 weight=3 max_fails=3 fail_timeout=30s;
    server backend-2:4000 weight=3 max_fails=3 fail_timeout=30s;
    server backend-3:4000 weight=2 max_fails=3 fail_timeout=30s backup;
    
    # Health check configuration
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;
}

# Define upstream for AI services (separate scaling)
upstream ai_services {
    least_conn;
    
    # AI service instances (can be scaled independently)
    server ai-service-1:4001 weight=2 max_fails=2 fail_timeout=20s;
    server ai-service-2:4001 weight=2 max_fails=2 fail_timeout=20s;
    
    keepalive 16;
}

# Define upstream for database read replicas
upstream database_read {
    # Round robin for read operations
    server postgres-read-1:5432 weight=2 max_fails=2 fail_timeout=15s;
    server postgres-read-2:5432 weight=2 max_fails=2 fail_timeout=15s;
    server postgres:5432 weight=1 backup; # Primary as backup for reads
}

# Sticky sessions for WebSocket connections
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# IP hash for session affinity when needed
upstream backend_sticky {
    ip_hash;
    server backend-1:4000 weight=3 max_fails=3 fail_timeout=30s;
    server backend-2:4000 weight=3 max_fails=3 fail_timeout=30s;
    server backend-3:4000 weight=2 max_fails=3 fail_timeout=30s;
}

# Health check locations
server {
    listen 8080;
    server_name health-check;
    
    location /health/backend {
        proxy_pass http://backend_cluster/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        access_log off;
    }
    
    location /health/ai {
        proxy_pass http://ai_services/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        access_log off;
    }
    
    location /health/load-balancer {
        return 200 "Load balancer healthy\n";
        add_header Content-Type text/plain;
        access_log off;
    }
}