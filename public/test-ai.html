<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Service Test</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a1a;
            color: #00ff00;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .test-result {
            background: #1a1a2e;
            border: 1px solid #00ff00;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { border-color: #00ff00; }
        .error { border-color: #ff0000; color: #ff0000; }
        .info { border-color: #00ffff; color: #00ffff; }
        button {
            background: #00ff00;
            color: #0a0a1a;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-family: inherit;
            margin: 5px;
        }
        button:hover {
            background: #00cc00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 AI Service Integration Test</h1>
        <p>This page tests if the AI service integration is working correctly.</p>
        
        <div id="test-results"></div>
        
        <button onclick="runTests()">Run AI Service Tests</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>

    <script>
        const resultsDiv = document.getElementById('test-results');
        
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            resultsDiv.appendChild(div);
            resultsDiv.scrollTop = resultsDiv.scrollHeight;
        }
        
        function clearResults() {
            resultsDiv.innerHTML = '';
        }
        
        async function runTests() {
            addResult('🚀 Starting AI Service Tests...', 'info');
            
            try {
                // Test 1: Check if the main app is running
                addResult('📡 Testing main application connection...', 'info');
                const response = await fetch('/');
                if (response.ok) {
                    addResult('✅ Main application is running successfully', 'success');
                } else {
                    addResult('❌ Main application connection failed', 'error');
                }
                
                // Test 2: Check if we can access the AI service modules
                addResult('🔧 Testing AI service module availability...', 'info');
                
                // Since we can't directly import ES modules in this context,
                // we'll test by checking if the main app loads without errors
                const appContent = await response.text();
                if (appContent.includes('unifiedAIService') || appContent.includes('multiProviderAI')) {
                    addResult('✅ AI service modules are included in the build', 'success');
                } else {
                    addResult('ℹ️ AI service modules not directly visible in HTML (this is normal)', 'info');
                }
                
                // Test 3: Check if React components are loading
                addResult('⚛️ Testing React application loading...', 'info');
                if (appContent.includes('react') && appContent.includes('root')) {
                    addResult('✅ React application structure detected', 'success');
                } else {
                    addResult('❌ React application structure not found', 'error');
                }
                
                // Test 4: Check if tRPC is configured
                addResult('🔌 Testing tRPC configuration...', 'info');
                if (appContent.includes('trpc') || appContent.includes('TRPCProvider')) {
                    addResult('✅ tRPC configuration detected', 'success');
                } else {
                    addResult('ℹ️ tRPC configuration not directly visible (this may be normal)', 'info');
                }
                
                addResult('🎉 Basic integration tests completed! Check the main app for full functionality.', 'success');
                addResult('💡 Navigate to the main app to test AI service features in the Dashboard.', 'info');
                
            } catch (error) {
                addResult(`❌ Test failed: ${error.message}`, 'error');
            }
        }
        
        // Auto-run tests when page loads
        window.addEventListener('load', () => {
            setTimeout(runTests, 1000);
        });
    </script>
</body>
</html>
